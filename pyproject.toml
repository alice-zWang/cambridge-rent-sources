[project]
name = "cambridge-rent-sources"
version = "0.2.0"
description = "Cambridge rent sources comparison and hedonic housing-price study"
requires-python = ">=3.12,<3.14"
dependencies = [
    "esda>=2.10.0",
    "geopandas>=1.2.0",
    "libpysal>=4.15.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyproj>=3.8.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.54.1",
    "shapely>=2.2.0",
    "spreg>=1.9.2",
    "statsmodels>=0.15.0",
]

[tool.uv]
package = false
